# Keep enough heap and metaspace for the multi-module build, Compose, KSP, and ktlint.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Reuse task outputs and configure independent projects concurrently.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=fail
org.gradle.tooling.parallel=true

# Android and Kotlin build defaults.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.project.isolation.enabled=true
